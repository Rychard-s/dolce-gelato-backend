spring.application.name=backend
server.port=8080

# Conexión a MySQL (crea la base de datos si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/dolce_gelato?createDatabaseIfNotExist=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=12345

# Hibernate crea y actualiza las tablas solo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Si un número llega vacío, usa 0 en lugar de fallar
spring.jackson.deserialization.fail-on-null-for-primitives=false
# JWT: clave para firmar los tokens (mínimo 32 caracteres) y duración en horas
jwt.secreto=dolce-gelato-upn-soluciones-web-2026-clave-secreta-jwt
jwt.horas=8